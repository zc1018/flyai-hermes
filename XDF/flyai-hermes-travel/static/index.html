<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旅行查询助手</title>
    <link rel="stylesheet" href="assets/styles.css?v=20260519-10" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="产品状态">
        <div class="brand-block">
          <p class="eyebrow">Hermes / FlyAI</p>
          <h1>旅行查询助手</h1>
          <p class="topline">用一句话查询实时交通、酒店和行程建议，结果会自动整理成可读卡片。</p>
        </div>
        <div class="top-actions">
          <a class="admin-link is-hidden" id="adminLink" href="admin">后台</a>
          <button class="ghost-button is-hidden" id="logoutButton" type="button">退出</button>
          <div class="status-pill" id="healthStatus">检查环境中</div>
        </div>
      </section>

      <section class="login-panel" id="loginPanel">
        <div>
          <p class="section-label">受邀访问</p>
          <h2>输入访问口令后开始查询</h2>
          <p>这是小范围使用的测试版。请不要输入身份证、护照号、手机号、订单号等隐私信息。</p>
          <div class="login-points" aria-label="产品能力">
            <span>实时查询</span>
            <span>卡片结果</span>
            <span>历史隔离</span>
          </div>
        </div>
        <form id="loginForm" class="login-form">
          <label for="passwordInput">访问口令</label>
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="输入你的口令" />
          <button type="submit">登录</button>
        </form>
      </section>

      <section class="workspace is-hidden" id="workspace">
        <aside class="history-panel">
          <div class="panel-heading">
            <h2>历史</h2>
            <button id="refreshHistory" class="icon-button" title="刷新历史">↻</button>
          </div>
          <input id="historySearch" class="history-search" type="search" placeholder="筛选历史" />
          <div class="history-list" id="historyList"></div>
        </aside>

        <section class="query-panel">
          <form id="queryForm" class="query-box" aria-label="旅行查询">
            <div class="query-head">
              <div>
                <p class="section-label">新查询</p>
                <h2>描述你的旅行需求</h2>
              </div>
              <span class="quota-pill" id="quotaStatus"></span>
            </div>
            <div class="prompt-chips" id="promptChips" aria-label="快捷查询"></div>
            <textarea
              id="queryInput"
              maxlength="2000"
              placeholder="例如：2026 年端午节前后，北京东京往返机票，停留 5 晚，上午北京出发，下午或晚上东京返回，不转机，给我最低价方案。"
            ></textarea>
            <div class="query-actions">
              <span id="queryHint">Hermes 会加载 flyai skill 查询实时旅行信息</span>
              <span id="queryCount" class="small">0/2000</span>
              <button class="ghost-button" type="button" id="clearQueryButton">清空</button>
              <button type="submit" id="queryButton">查询</button>
            </div>
          </form>

          <div class="result-meta" id="resultMeta"></div>
          <section class="results" id="results" aria-live="polite">
            <article class="empty-state">
              <div class="empty-map" aria-hidden="true">
                <span></span><span></span><span></span>
              </div>
              <div>
                <p class="section-label">准备查询</p>
                <h2>先从一个具体问题开始</h2>
                <p>说清楚城市、日期、人数、预算和偏好。往返机票请明确去程和返程要求，系统会优先生成双段航班卡片。</p>
              </div>
            </article>
          </section>
        </section>
      </section>
    </main>

    <script src="assets/app.js?v=20260519-10"></script>
  </body>
</html>
