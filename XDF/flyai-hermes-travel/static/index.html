<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hermes FlyAI Travel</title>
    <link rel="stylesheet" href="assets/styles.css?v=20260519-3" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">Hermes / FlyAI</p>
          <h1>旅行查询工作台</h1>
        </div>
        <div class="status-pill" id="healthStatus">检查环境中</div>
      </section>

      <section class="login-panel" id="loginPanel">
        <div>
          <h2>内部访问</h2>
          <p>输入服务端配置的访问口令后开始查询。</p>
        </div>
        <form id="loginForm" class="login-form">
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="访问口令" />
          <button type="submit">登录</button>
        </form>
      </section>

      <section class="workspace is-hidden" id="workspace">
        <aside class="history-panel">
          <div class="panel-heading">
            <h2>历史</h2>
            <button id="refreshHistory" class="icon-button" title="刷新历史">↻</button>
          </div>
          <div class="history-list" id="historyList"></div>
        </aside>

        <section class="query-panel">
          <form id="queryForm" class="query-box">
            <textarea
              id="queryInput"
              placeholder="例如：杭州西湖附近 5 月 20 到 22 号酒店，预算每晚 800 以内，优先评分高"
            ></textarea>
            <div class="query-actions">
              <span id="queryHint">Hermes 会加载 flyai skill 查询实时旅行信息</span>
              <button type="submit" id="queryButton">查询</button>
            </div>
          </form>

          <div class="result-meta" id="resultMeta"></div>
          <section class="results" id="results"></section>
        </section>
      </section>
    </main>

    <script src="assets/app.js?v=20260519-3"></script>
  </body>
</html>
